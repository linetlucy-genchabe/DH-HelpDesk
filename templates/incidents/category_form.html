{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block topbar_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <div><div class="page-title">{{ title }}</div></div>
  <div class="page-header-actions">
    <a href="{% url 'category_list' %}" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
</div>

<div class="card" style="max-width:500px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="form-group">
          <label class="form-label req">Category Name</label>
          <input type="text" name="name" class="form-control" value="{{ form.name.value|default:'' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3">{{ form.description.value|default:'' }}</textarea>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" name="is_active" {% if form.is_active.value != False %}checked{% endif %}> Active
          </label>
        </div>
      </div>
      <hr class="divider">
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <a href="{% url 'category_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
