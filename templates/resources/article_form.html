{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block topbar_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <div><div class="page-title">{{ title }}</div></div>
  <div class="page-header-actions">
    <a href="{% url 'article_list' %}" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
</div>

<div class="card" style="max-width:860px;">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group span-2">
          <label class="form-label req">Title</label>
          <input type="text" name="title" class="form-control" value="{{ obj.title|default:'' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select name="category" class="form-control">
            <option value="">— No Category —</option>
            {% for cat in categories %}<option value="{{ cat.pk }}" {% if obj and obj.category_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Video URL <span class="form-hint">(YouTube or direct MP4)</span></label>
          <input type="url" name="video_url" class="form-control" value="{{ obj.video_url|default:'' }}" placeholder="https://youtube.com/...">
        </div>
        <div class="form-group">
          <label class="form-label">Cover Image</label>
          <input type="file" name="cover_image" class="form-control" accept="image/*">
          {% if obj and obj.cover_image %}<div style="margin-top:6px;"><img src="{{ obj.cover_image.url }}" style="height:60px;object-fit:cover;border-radius:4px;"></div>{% endif %}
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:28px;">
            <input type="checkbox" name="is_published" {% if not obj or obj.is_published %}checked{% endif %}> Published
          </label>
        </div>
        <div class="form-group span-2">
          <label class="form-label req">Content <span class="form-hint">(HTML supported — headings, bold, lists, images)</span></label>
          <textarea name="content" id="articleContent" class="form-control" rows="16" style="font-family:var(--font-mono);font-size:0.82rem;" required>{{ obj.content|default:'' }}</textarea>
        </div>
      </div>
      <hr class="divider">
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Article</button>
        <a href="{% url 'article_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
