{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block topbar_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">{{ title }}</div>
    {% if obj %}<div class="page-subtitle">Editing: {{ obj }}</div>{% endif %}
  </div>
  <div class="page-header-actions">
    <a href="{% url 'device_list' %}" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
</div>

<div class="card" style="max-width:760px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}

      {% if status_only %}
      <!-- CHA/Ward CHA — status and notes only -->
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label req">Status</label>
          <select name="status" class="form-control">
            {% for val, label in statuses %}
            <option value="{{ val }}" {% if obj and obj.status == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group span-2">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="3">{{ obj.notes|default:'' }}</textarea>
        </div>
      </div>

      {% else %}
      <!-- Full form -->
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label req">Assigned To (Name)</label>
          <input type="text" name="assigned_to_name" class="form-control" value="{{ obj.assigned_to_name|default:'' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label req">Role</label>
          <select name="assigned_to_role" class="form-control">
            {% for val, label in roles %}
            <option value="{{ val }}" {% if obj and obj.assigned_to_role == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label req">CHU</label>
          <select name="chu" class="form-control" required>
            <option value="">— Select CHU —</option>
            {% for chu in chus %}
            <option value="{{ chu.pk }}" {% if obj and obj.chu_id == chu.pk %}selected{% endif %}>{{ chu.name }} ({{ chu.ward.subcounty.name }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label req">Device Type</label>
          <select name="device_type" class="form-control">
            {% for val, label in device_types %}
            <option value="{{ val }}" {% if obj and obj.device_type == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Model</label>
          <input type="text" name="phone_model" class="form-control" value="{{ obj.phone_model|default:'' }}" placeholder="e.g. Samsung Galaxy A05">
        </div>
        <div class="form-group">
          <label class="form-label">Serial Number</label>
          <input type="text" name="serial_number" class="form-control" value="{{ obj.serial_number|default:'' }}">
        </div>
        <div class="form-group">
          <label class="form-label">IMEI</label>
          <input type="text" name="imei" class="form-control" value="{{ obj.imei|default:'' }}">
        </div>
        <div class="form-group">
          <label class="form-label req">Status</label>
          <select name="status" class="form-control">
            {% for val, label in statuses %}
            <option value="{{ val }}" {% if obj and obj.status == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date Assigned</label>
          <input type="date" name="date_assigned" class="form-control" value="{{ obj.date_assigned|default:'' }}">
        </div>
        <div class="form-group span-2">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="3">{{ obj.notes|default:'' }}</textarea>
        </div>
      </div>
      {% endif %}

      <hr class="divider">
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-orange"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <a href="{% url 'device_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
