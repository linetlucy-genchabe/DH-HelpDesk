{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block topbar_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <div><div class="page-title">{{ title }}</div>{% if obj %}<div class="page-subtitle">{{ obj.name }}</div>{% endif %}</div>
  <div class="page-header-actions"><a href="{% url 'cha_list' %}" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back</a></div>
</div>

<div class="card" style="max-width:760px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group span-2">
          <label class="form-label req">Full Name</label>
          <input type="text" name="name" class="form-control" value="{{ obj.name|default:'' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label req">Sub-County</label>
          <select name="subcounty" class="form-control" required>
            <option value="">— Select Sub-County —</option>
            {% for sc in subcounties %}<option value="{{ sc.pk }}" {% if obj and obj.subcounty_id == sc.pk %}selected{% endif %}>{{ sc.name }} ({{ sc.county.name }})</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ obj.phone|default:'' }}" placeholder="07XXXXXXXX">
        </div>
        <div class="form-group span-2">
          <label class="form-label">Assigned CHUs <span class="form-hint">(hold Ctrl/Cmd to select multiple)</span></label>
          <select name="chus" class="form-control" multiple style="min-height:100px;">
            {% for chu in chus %}<option value="{{ chu.pk }}" {% if obj and chu in obj.chus.all %}selected{% endif %}>{{ chu.name }} ({{ chu.ward.subcounty.name }})</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" name="is_active" {% if not obj or obj.is_active %}checked{% endif %}> Active
          </label>
        </div>
      </div>

      <hr class="divider">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;">
        <!-- eCHIS -->
        <div>
          <div style="font-size:0.78rem;font-weight:800;color:var(--lg-blue);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--lg-blue-light);">eCHIS</div>
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label">Username</label>
            <input type="text" name="echis_username" class="form-control font-mono" value="{{ obj.echis_username|default:'' }}" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="text" name="echis_password" class="form-control font-mono" value="{{ obj.echis_password|default:'' }}" autocomplete="off">
          </div>
        </div>
        <!-- Dashboard -->
        <div>
          <div style="font-size:0.78rem;font-weight:800;color:var(--lg-orange);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--lg-orange-light);">Dashboard</div>
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label">Username</label>
            <input type="text" name="dashboard_username" class="form-control font-mono" value="{{ obj.dashboard_username|default:'' }}" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="text" name="dashboard_password" class="form-control font-mono" value="{{ obj.dashboard_password|default:'' }}" autocomplete="off">
          </div>
        </div>
        <!-- Registry -->
        <div>
          <div style="font-size:0.78rem;font-weight:800;color:var(--lg-sky);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--lg-sky-light);">Registry</div>
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label">Username</label>
            <input type="text" name="registry_username" class="form-control font-mono" value="{{ obj.registry_username|default:'' }}" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="text" name="registry_password" class="form-control font-mono" value="{{ obj.registry_password|default:'' }}" autocomplete="off">
          </div>
        </div>
      </div>

      <hr class="divider">
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-orange"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <a href="{% url 'cha_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
