{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block topbar_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <div><div class="page-title">{{ title }}</div>{% if obj %}<div class="page-subtitle">{{ obj.name }}</div>{% endif %}</div>
  <div class="page-header-actions"><a href="{% url 'chp_list' %}" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back</a></div>
</div>

<div class="card" style="max-width:640px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group span-2">
          <label class="form-label req">Full Name</label>
          <input type="text" name="name" class="form-control" value="{{ obj.name|default:'' }}" required>
        </div>
        <div class="form-group span-2">
          <label class="form-label req">CHU</label>
          <select name="chu" class="form-control" required>
            <option value="">— Select CHU —</option>
            {% for chu in chus %}<option value="{{ chu.pk }}" {% if obj and obj.chu_id == chu.pk %}selected{% endif %}>{{ chu.name }} ({{ chu.ward.subcounty.name }})</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ obj.phone|default:'' }}" placeholder="07XXXXXXXX">
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:22px;">
            <input type="checkbox" name="is_active" {% if not obj or obj.is_active %}checked{% endif %}> Active
          </label>
        </div>
      </div>

      <hr class="divider">
      <div style="font-size:0.82rem;font-weight:700;color:var(--gray-600);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.5px;">eCHIS Credentials</div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">eCHIS Username</label>
          <input type="text" name="echis_username" class="form-control font-mono" value="{{ obj.echis_username|default:'' }}" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">eCHIS Password</label>
          <input type="text" name="echis_password" class="form-control font-mono" value="{{ obj.echis_password|default:'' }}" autocomplete="off">
        </div>
      </div>

      <hr class="divider">
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-orange"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <a href="{% url 'chp_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
